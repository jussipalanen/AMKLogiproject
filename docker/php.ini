; AMKLogi PHP settings (loaded after the image defaults)
expose_php = Off
memory_limit = 256M
; album uploads: up to 20 images of 5 MB (params uploadMaxFiles / uploadMaxFileSizeMb)
upload_max_filesize = 6M
post_max_size = 105M
max_file_uploads = 20
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
